<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finalizar compra</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<div id="header"></div>
<main class="page"><div class="wrap">
  <h1>Finalizar compra</h1>
  <div class="checkout">
    <form class="form-card" id="form" novalidate>
      <h2>Tus datos</h2>
      <div class="fields">
        <div class="field field--full"><label for="nombre">Nombre y apellido</label><input id="nombre" name="nombre" autocomplete="name" required></div>
        <div class="field"><label for="email">Correo</label><input id="email" name="email" type="email" autocomplete="email" required><small>Aquí te llega la confirmación</small></div>
        <div class="field"><label for="telefono">Teléfono</label><input id="telefono" name="telefono" type="tel" autocomplete="tel" placeholder="+56 9 1234 5678" required></div>
        <div class="field field--full"><label for="rut">RUT <span style="font-weight:400;color:var(--muted)">(opcional, para tu boleta)</span></label><input id="rut" name="rut" placeholder="12.345.678-9"></div>
      </div>
      <h2 style="margin-top:2rem">Entrega</h2>
      <div class="fields">
        <div class="field field--full"><label for="entrega">¿Dónde te lo entregamos?</label><select id="entrega" name="entrega" required><option value="">Elige tu localidad</option></select>
          <small id="entregaAyuda"></small></div>
        <div class="field field--full" id="campoDireccion"><label for="direccion">Dirección</label><input id="direccion" name="direccion" autocomplete="street-address" placeholder="Calle, número, depto. o sector" required></div>
        <div class="field field--full"><label for="notas">Indicaciones para la entrega <span style="font-weight:400;color:var(--muted)">(opcional)</span></label><textarea id="notas" name="notas" rows="2" placeholder="Ej: casa con reja verde, entregar después de las 18 h"></textarea></div>
      </div>
      <div class="form-error" id="error" role="alert"></div>
    </form>

    <aside class="resumen">
      <h2>Tu pedido</h2>
      <div id="items"></div>
      <div class="res-row"><span>Subtotal</span><span id="subtotal"></span></div>
      <div class="res-row"><span id="envioEtq">Entrega</span><span id="envio">Elige tu localidad</span></div>
      <div class="res-row res-row--total"><span>Total</span><span id="total"></span></div>
      <button class="btn pay-btn" id="pagar" form="form" type="submit">Pagar</button>
      <span class="secure">Serás redirigida al sitio seguro del medio de pago. Después te escribimos por WhatsApp para coordinar la entrega.</span>
    </aside>
  </div>
</div></main>
<div id="footer"></div>
<script src="/js/comun.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
